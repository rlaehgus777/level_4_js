<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dom2-DOM 생성 삽입 삭제 복제</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <script src="./scripts/dom2.js" defer></script>
    <style>
        header {}
        header .d_menu {}
        header .d_menu nav {}
        header .d_menu nav a {color:#00f;}
        header .m_menu {}
        header .m_menu nav {}
        header .m_menu nav a {color:#f00;}
    </style>
</head>
<body>
    <header>
        <!-- 데스크탑 메뉴(JS 동적 붙여넣기 대상) -->
        <div class="d_menu"><!-- 붙여넣기 위치 --></div>
        <!-- 모바일 메뉴(태그o) -->
        <div class="m_menu">
            <nav>
                <a href="#">HOME</a>
                <a href="#">ABOUT</a>
                <a href="#">PROJECT</a>
                <a href="#">CONTACT</a>
            </nav>
        </div>
    </header>
</body>
</html>
