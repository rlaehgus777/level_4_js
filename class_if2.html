<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클래스활용+조건문2</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <script src="./scripts/class_if2.js" defer></script>
    <style>
        p {background-color:#ff0;} /* 기본 디자인 */
        #btn1 {border:1px solid #222; padding:10px;}
        em {font-weight:800; color:#ff0; text-decoration:underline;}
        input {border:1px solid #000; padding:10px;}
        /* 자바스크립트 제어목적 클레스 */
        .error {background-color:#f00; color:#fff;}
    </style>
</head>
<body>
    <p>안내문구</p>
    <input type="text" name="user_id" id="user_id" placeholder="아이디를 입력하세요.">
    <button type="button" id="btn1">클래스 제어</button>
</body>
</html>
